name: PR Bot Review & Charter Guard

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  charter-guard:
    name: 🤖 Charter & Scope Review Bot
    runs-on: ubuntu-latest
    steps:
      - name: Automated PR Bot Review & Labeling
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;
            const body = pr.body || "";
            const title = pr.title || "";

            // 1. Fetch changed files
            const files = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: prNumber,
            });

            const filenames = files.data.map(f => f.filename);
            const codeChanged = filenames.some(f => f.startsWith("focuspack/"));
            const testsChanged = filenames.some(f => f.startsWith("tests/"));
            const depsChanged = filenames.some(f => f === "pyproject.toml");

            // 2. Check Charter Checklist items
            const checkPillars = /\[[xX]\]\s*(?:\*\*)?Strengthens Core Pillars/i.test(body);
            const checkNonGoals = /\[[xX]\]\s*(?:\*\*)?Respects Non-Goals/i.test(body);
            const checkTargetInviolability = /\[[xX]\]\s*(?:\*\*)?Target Inviolability/i.test(body);
            const checkZeroNode = /\[[xX]\]\s*(?:\*\*)?Zero-Node Runtime/i.test(body);

            const checklistComplete = checkPillars && checkNonGoals && checkTargetInviolability && checkZeroNode;

            // 3. Scan for Non-Goal Red Flags in Title & Body
            const bannedKeywords = [
              "vector db",
              "chromadb",
              "pinecone",
              "qdrant",
              "weaviate",
              "rag pipeline",
              "electron",
              "desktop app",
              "flat dumper",
              "monolithic dump",
              "cloud upload",
              "telemetry"
            ];

            const foundRedFlags = bannedKeywords.filter(kw =>
              title.toLowerCase().includes(kw) || body.toLowerCase().includes(kw)
            );

            // 4. Determine Status & Labels
            let labelsToAdd = [];
            let labelsToRemove = [];
            let issuesFound = [];

            if (foundRedFlags.length > 0) {
              issuesFound.push(`⚠️ **Non-Goal Warning**: Detected terms matching explicit Non-Goals in [CHARTER.md](https://github.com/maqbulansari/focuspack/blob/main/CHARTER.md): \`${foundRedFlags.join(", ")}\`. Please verify this does not violate project guardrails.`);
              labelsToAdd.push("out-of-scope");
            } else {
              labelsToRemove.push("out-of-scope");
            }

            if (!checklistComplete) {
              issuesFound.push("⚠️ **Incomplete Charter Checklist**: Please ensure all 4 items under `🎯 Goal Alignment Verification` in the PR description are verified and checked.");
              labelsToAdd.push("needs-checklist");
            } else {
              labelsToRemove.push("needs-checklist");
            }

            if (codeChanged && !testsChanged) {
              issuesFound.push("⚠️ **Missing Tests**: Changes were made to `focuspack/` source code without corresponding updates in `tests/`. Please add unit tests to maintain coverage.");
              labelsToAdd.push("needs-tests");
            } else {
              labelsToRemove.push("needs-tests");
            }

            if (issuesFound.length === 0) {
              labelsToAdd.push("goal-aligned");
            } else {
              labelsToRemove.push("goal-aligned");
            }

            // Apply and remove labels accurately
            const prDetails = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const currentLabels = (prDetails.data.labels || []).map(l => l.name);

            const toAdd = labelsToAdd.filter(l => !currentLabels.includes(l));
            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: toAdd,
              });
            }

            for (const label of labelsToRemove) {
              if (currentLabels.includes(label)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: prNumber,
                    name: label,
                  });
                } catch (e) {
                  // Ignore if label was already removed
                }
              }
            }

            // 5. Construct Sticky Bot Review Comment
            const statusIcon = issuesFound.length === 0 ? "✅ **ALL CHECKS PASSED**" : "⚠️ **ACTION ITEMS REQUIRED**";
            const summaryTable = `
| Checkpoint | Status | Details |
| :--- | :---: | :--- |
| **Charter Alignment** | ${checklistComplete ? "✅ Verified" : "⚠️ Incomplete"} | PR Template Checklist Verified |
| **Scope Shield** | ${foundRedFlags.length === 0 ? "✅ Clean" : "⚠️ Flagged"} | No Non-Goals detected |
| **Test Coverage** | ${(!codeChanged || testsChanged) ? "✅ Included" : "⚠️ Missing"} | Tests matched to code changes |
| **Runtime Footprint** | ${!depsChanged ? "✅ Pure Python" : "🔍 Dependencies Modified"} | Zero-heavy runtime guard |
`;

            let reviewBody = `<!-- focuspack-bot-review -->
### 🤖 focuspack Automated PR Review & Charter Guard

Thank you @${pr.user.login} for your contribution! Here is the automated evaluation against our **[Product Charter](https://github.com/maqbulansari/focuspack/blob/main/CHARTER.md)**:

${summaryTable}
${statusIcon}

`;

            if (issuesFound.length > 0) {
              reviewBody += `#### 📋 Required Actions:\n` + issuesFound.map(item => `- ${item}`).join("\n") + `\n\n`;
            } else {
              reviewBody += `🎉 This PR is verified to align with our Core Pillars (**Focus Target Inviolability, AST Contracts, Adaptive Budgets, Pure Python**). Ready for maintainer review!\n\n`;
            }

            reviewBody += `*Automated by focuspack Charter Bot • [View Charter & Non-Goals](https://github.com/maqbulansari/focuspack/blob/main/CHARTER.md)*`;

            // 6. Update existing sticky comment or create a new one
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const existingComment = comments.data.find(c => c.body.includes("<!-- focuspack-bot-review -->"));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: reviewBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: reviewBody,
              });
            }
