[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "focuspack"
version = "0.2.0"
description = "Focus-driven, budget-aware codebase context packager for LLMs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "focuspack contributors" }
]
keywords = [
    "llm",
    "context-engineering",
    "prompt-caching",
    "token-budget",
    "codebase-to-prompt",
    "claude",
    "chatgpt",
    "gemini",
    "ast-analysis",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pathspec>=0.11.0",
]

[project.optional-dependencies]
tiktoken = [
    "tiktoken>=0.5.0",
]
clipboard = [
    "pyperclip>=1.8.2",
]
all = [
    "tiktoken>=0.5.0",
    "pyperclip>=1.8.2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.scripts]
focuspack = "focuspack.cli:main"
fp = "focuspack.cli:main"

[project.urls]
Homepage = "https://github.com/maqbulansari/focuspack"
Repository = "https://github.com/maqbulansari/focuspack"
Issues = "https://github.com/maqbulansari/focuspack/issues"
Documentation = "https://github.com/maqbulansari/focuspack#readme"

[tool.hatch.build.targets.wheel]
packages = ["focuspack"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
