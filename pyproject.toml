[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repodigest"
version = "0.1.0"
description = "Fast, intelligent codebase packaging & AST-aware context generator for LLMs & Developers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "repodigest contributors" }
]
keywords = [
    "cli",
    "developer-tools",
    "llm",
    "codebase-context",
    "ast-analysis",
    "git",
    "claude",
    "chatgpt",
    "gemini",
    "markdown",
    "token-counter"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pathspec>=0.11.0",
]

[project.optional-dependencies]
tiktoken = [
    "tiktoken>=0.5.0",
]
clipboard = [
    "pyperclip>=1.8.2",
]
all = [
    "tiktoken>=0.5.0",
    "pyperclip>=1.8.2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.scripts]
repodigest = "repodigest.cli:main"
rdigest = "repodigest.cli:main"

[project.urls]
Homepage = "https://github.com/USER/repodigest"
Repository = "https://github.com/USER/repodigest"
Issues = "https://github.com/USER/repodigest/issues"
Documentation = "https://github.com/USER/repodigest#readme"

[tool.hatch.build.targets.wheel]
packages = ["repodigest"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
